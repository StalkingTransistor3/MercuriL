<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#283648">
  <title>Admin sign in — MercuriL</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="/login.css">
  <script src="/login.js" defer></script>
</head>
<body>
  <main class="login-card">
    <div class="wordmark" aria-label="MercuriL">Mercuri<span>L</span></div>
    <p class="tagline">Admin console</p>
    <div class="divider"></div>
    <h1>Admin sign in</h1>
    <p class="intro">Approve account requests and manage access.</p>
    <form id="loginForm" data-admin="true" method="post" action="/auth/admin/login">
      <input name="username" value="admin" autocomplete="username" hidden>
      <label for="password">Admin password</label>
      <div class="password-field">
        <input id="password" name="password" type="password" autocomplete="current-password" maxlength="256" required autofocus>
        <button class="reveal" id="reveal" type="button" aria-label="Show password" aria-pressed="false">Show</button>
      </div>
      <p class="error" id="error" role="alert" aria-live="polite"></p>
      <button class="submit" id="submit" type="submit">Sign in</button>
    </form>
    <p class="help"><a href="/login">Back to member sign in</a></p>
  </main>
</body>
</html>
